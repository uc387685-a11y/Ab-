
name: Build Hello Umesh AI APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and Build Android APK
        run: |
          WRAPPER=$(find . -type f -name gradlew -not -path '*/.gradle/*' -print -quit)

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: gradlew file not found!"
            find . -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$WRAPPER")
          cd "$PROJECT_DIR"

          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hello-Umesh-AI-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
